[build-system]
requires = ["setuptools>=42.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppinsight"
version = "0.0.1"
description = "This is a package to pull protein data from FASTA and Uniport databases, run them through multiple modeling tools and give a final visualization to compare between models"
authors = [
    { name = "Rita Kamenetskiy", email = "maka6830@uw.edu" },
    { name = "Ike Keku" },
    { name = "Fiona McLary" },
    { name = "Walter Avila" },
    { name = "Maya Gatt Harari" }
]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "requests>=2.25.0",
    "biopython>=1.79",
    "lightdock",
    "networkx",       # required by DockQ and by Rosetta clustering
]

[project.optional-dependencies]
# DockQ enables the ppinsight.quality module (CAPRI quality assessment).
# We install from a fork that supports numpy ≥ 2.0 (upstream PR #61).
# Once upstream DockQ releases a numpy-2-compatible version, replace this
# with a simple:  "dockq>=2.2"
quality = [
    "dockq @ git+https://github.com/nrontsis/DockQ.git@update-to-numpy>2",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ppinsight = "ppinsight.cli:main"
protein_fetch = "ppinsight.protein_fetch:main"
pdb_to_lightdock = "ppinsight.pdb_to_lightdock:main"
pdb_to_haddock = "ppinsight.pdb_to_haddock:main"
pdb_to_rosetta = "ppinsight.pdb_to_rosetta:main"
compare_scores = "ppinsight.visualizer:main"
collect_scores = "ppinsight.collect_scores:main"
parse_pairs = "ppinsight.parse_pairs:main"
batch_dock = "ppinsight.batch_dock:main"
ppinsight_quality = "ppinsight.quality:main"

# Optional upgrades beyond the default ruff rules
[tool.ruff.lint]
select = [
    "E", # pycodestyle: detect deviations from PEP8 rules
    "W", # pycodestyle warnings: detect deviations from PEP8 suggestions
    "F", # Pyflakes: detect code errors, potential bugs
    "B", # flake8-bugbear: detect antipatterns that can lead to bugs
    # "A", # flake8-builtins: detect overloading python builtins
    # "N", # pep8-naming: detect deviations from PEP naming conventions
    # "I", # isort: better import organization
    # "D", # pydocstyle: check docstrings
    # "C4", # flake8-comprehensions: check for code simplifications with comprehensions
    # "SIM", # flake8-simplify: check for code simplifications
    # "UP", # pyupgrade: check for syntax improvments in new python versions
    # "C90", # McCabe complexity
    ]

[tool.ruff]
line-length = 88
