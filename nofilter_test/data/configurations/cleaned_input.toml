# ====================================================================
    # Protein-protein docking example (auto-generated by PPInsight)

    # directory in which the scoring will be done
    run_dir = "nofilter_test"

    # execution mode ("local" or "batch")
    mode = "local"
    ncores = 4

    # molecules to be docked (data-relative paths)
    molecules =  [
        "data/P15692.pdb",
        "data/Q15256.pdb"
        ]

    # ====================================================================
    # HADDOCK3 pipeline stages (executed in order)
    # ====================================================================

    # Topology generation — protonation and histidine states
['topoaa.1']
    autohis = false
['topoaa.1'.mol1]
    nhisd = 0
    nhise = 1
    hise_1 = 75
['topoaa.1'.mol2]
    nhisd = 1
    hisd_1 = 76
    nhise = 1
    hise_1 = 15

    # Rigid-body energy minimization (it0)
['rigidbody.1']
    tolerance = 5
    ambig_fname = ""
    sampling = 20

    cmrest = true

    # Score evaluation against reference (leave blank for no reference)
['caprieval.1']
    reference_fname = ""

    # Select top models to carry forward to flexible refinement
['seletop.1']
    select = 5

    # Semi-flexible refinement (it1)
['flexref.1']
    tolerance = 5
    ambig_fname = ""
    cmrest = true


    # Final energy minimization in explicit solvent (itw)
['emref.1']
    tolerance = 5
    ambig_fname = ""

    # Fraction of Common Contacts clustering
['clustfcc.1']
    min_population = 1

    # Select top cluster representatives for final analysis
['seletopclusts.1']
    top_models = 4
    # ====================================================================
